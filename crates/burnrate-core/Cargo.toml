[package]
name = "burnrate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform-independent BurnRate logic: parsing, quota APIs, alerts, charts"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The updater verifies a downloaded release zip against the release's own
# SHA256SUMS before it is allowed near the installed bundle.
sha2 = "0.10"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
png = "0.17"
ureq = { version = "2", features = ["json"] }
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
