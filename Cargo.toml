[workspace]
resolver = "2"
members = ["crates/burnrate-core", "crates/icon-gen", "src-tauri"]

# The version here is the app's *only* version. Tauri's generated context reads
# it when `src-tauri/tauri.conf.json` omits `version` (which it must), and
# `burnrate_core::VERSION` reports it too, so the two numbers in About cannot
# disagree. release-please bumps it; see release-please-config.json.
#
# Nothing platform-specific lives in the workspace root.

[workspace.package]
version = "0.9.4"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
