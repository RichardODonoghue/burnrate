[workspace]
resolver = "2"
members = ["crates/burnrate-core", "src-tauri"]

# Tauri's generated context/config reads these from src-tauri/tauri.conf.json;
# nothing platform-specific lives in the workspace root.

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
