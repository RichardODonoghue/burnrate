<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BurnRate</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="sidebar" id="sidebar" aria-label="Sections">
        <div class="brand">
          <img id="brand-icon" alt="" width="28" height="28" />
          <div>
            <strong>BurnRate</strong>
            <span id="brand-sub">—</span>
          </div>
        </div>
        <ul id="pane-list"></ul>
        <div class="sidebar-foot">
          <span id="platform-note"></span>
        </div>
      </nav>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <!-- usage.js first: it registers the pane's renderer, and app.js resolves it
         from `window.BurnRate` during its first render. Loading them the other
         way round works only because the first paint happens after an await. -->
    <script src="./usage.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
