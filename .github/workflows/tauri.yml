name: tauri

# CI for the Tauri rewrite (branch: rewrite/tauri).
#
#   core       frontend typecheck + tests, then fmt + clippy + cargo test
#   build      the app compiles on macOS, Windows and Linux
#   tray-smoke the Gate 0 runtime check: a real tray under a real
#              StatusNotifierWatcher in a container (scripts/tauri-smoke.sh)
#
# The frontend is TypeScript emitted as native ES modules, and
# `tauri::generate_context!` embeds `frontendDist` at *compile* time. So `tsc` has
# to run before `cargo build` in every job that compiles the app; without it the
# build succeeds and ships a window that renders nothing. A test in
# `src-tauri/src/lib.rs` uses `include_str!` on the emitted entry point, so a
# missing build is a compile error rather than a blank window.
#
# The Swift workflows keep running for `main` until the rewrite merges.

on:
  push:
    branches: [rewrite/tauri]
  pull_request:
    branches: [rewrite/tauri]

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Frontend
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Build
        run: cargo build --workspace --release

  tray-smoke:
    name: tray smoke (Linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build and run the tray smoke
        run: ./scripts/tauri-smoke.sh
