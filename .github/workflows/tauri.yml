name: tauri

# CI for the Tauri rewrite (branch: rewrite/tauri).
#
#   core       fmt + clippy + cargo test
#   build      the app compiles on macOS, Windows and Linux
#   tray-smoke the Gate 0 runtime check: a real tray under a real
#              StatusNotifierWatcher in a container (scripts/tauri-smoke.sh)
#
# The Swift workflows keep running for `main` until the rewrite merges.

on:
  push:
    branches: [rewrite/tauri]
  pull_request:
    branches: [rewrite/tauri]

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Build
        run: cargo build --workspace --release

  tray-smoke:
    name: tray smoke (Linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tray smoke
        run: ./scripts/tauri-smoke.sh
