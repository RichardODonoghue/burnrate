name: Release Please

# Parses conventional commits (feat:/fix:), opens/updates a version-bump
# PR titled "chore(main): release X.Y.Z"; merging it tags the release,
# which triggers release.yml (zip + dmg + GitHub Release).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
