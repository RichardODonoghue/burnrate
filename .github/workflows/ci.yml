name: CI

on:
  push:
    branches: [main]
  # Base-branch filter: these build and test the *Swift* app, which lives on
  # `main` until the Tauri rewrite is cut over. Without it they run on every PR,
  # including the rewrite's own PRs into `rewrite/tauri`, and gate them on the
  # app being replaced. The rewrite's checks are in `tauri.yml`.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Apple Silicon only (matches the shipping target); macos-15 = ARM.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (arm64)
        run: swift build --arch arm64 --build-tests

      - name: Test
        run: swift test --arch arm64

      - name: Bundle app
        run: scripts/make_app.sh ci

      - name: Verify arm64-only binary
        run: |
          BIN="dist/BurnRate.app/Contents/MacOS/BurnRate"
          file "$BIN" | grep -q "arm64" || { echo "not arm64"; exit 1; }
          file "$BIN" | grep -q "x86_64" && { echo "universal build not allowed"; exit 1; } || true

      - name: Upload CI artifact
        if: github.ref == 'refs/heads/main'
        run: ditto -c -k --keepParent dist/BurnRate.app BurnRate-ci-arm64.zip
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: BurnRate-ci-arm64
          path: BurnRate-ci-arm64.zip
          retention-days: 7
