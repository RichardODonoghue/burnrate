name: CI

# The only CI. BurnRate is a Rust + Tauri app; the Swift app and its three
# workflows (ci, core-linux, core-windows) were removed at the cutover.
#
#   core       frontend typecheck + tests, then fmt + clippy + cargo test
#   build      the app compiles *and bundles* on macOS, Windows and Linux
#   tray-smoke the runtime check: a real tray under a real StatusNotifierWatcher
#              in a container (scripts/tauri-smoke.sh)
#
# The frontend is TypeScript emitted as native ES modules, and
# `tauri::generate_context!` embeds `frontendDist` at *compile* time. So `tsc` has
# to run before `cargo build` in every job that compiles the app; without it the
# build succeeds and ships a window that renders nothing. A test in
# `src-tauri/src/lib.rs` uses `include_str!` on the emitted entry point, so a
# missing build is a compile error rather than a blank window.
#
# `build` bundles rather than plain-building, because the bundle is what ships
# and each platform's packaging fails differently (a missing `.deb` dependency, a
# WiX/NSIS download, a DMG that will not mount). The Tauri CLI comes from `npx`
# rather than `ui/package.json`, whose single devDependency is deliberate — see
# AGENTS.md.

on:
  push:
    branches: [main, rewrite/tauri]
  pull_request:
    branches: [main, rewrite/tauri]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI: npx --yes "@tauri-apps/cli@^2"

jobs:
  core:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Frontend
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Install the frontend
        working-directory: ui
        run: npm ci
      # `tauri build` runs `beforeBuildCommand` (`npm run build`), so the emitted
      # frontend is produced here and `tsc` cannot be forgotten.
      - name: Build and bundle
        run: ${{ env.TAURI_CLI }} build --bundles ${{ matrix.bundles }}

  tray-smoke:
    name: tray smoke (Linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Build and run the tray smoke
        run: ./scripts/tauri-smoke.sh
