name: Release

# Three entry points:
#  - push of a semver tag (manual tags)
#  - workflow_dispatch with an explicit tag (backfill an existing release)
#  - workflow_call from release-please.yml
#
# Why the explicit call: release-please creates its tag with GITHUB_TOKEN,
# and events raised with that token do NOT trigger other workflows. The tag
# push never fires this workflow, which is why v0.2.0 shipped without a
# zip/dmg. release-please.yml therefore invokes this workflow directly.
#
# Builds are split per OS and a final job publishes every artifact plus one
# combined SHA256SUMS (the in-app macOS updater requires a matching entry).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.2.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build bundle (arm64, version from tag)
        run: scripts/make_app.sh "${{ steps.v.outputs.version }}"

      - name: Verify arm64-only binary
        run: |
          BIN="dist/BurnRate.app/Contents/MacOS/BurnRate"
          file "$BIN" | grep -q "arm64" || { echo "not arm64"; exit 1; }
          file "$BIN" | grep -q "x86_64" && { echo "universal build not allowed"; exit 1; } || true

      - name: Zip app
        run: |
          ditto -c -k --keepParent dist/BurnRate.app \
            "BurnRate-${{ steps.v.outputs.version }}-arm64.zip"

      - name: Build DMG
        run: |
          VER="${{ steps.v.outputs.version }}"
          rm -rf dmg-staging && mkdir dmg-staging
          cp -R dist/BurnRate.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "BurnRate $VER" -srcfolder dmg-staging \
            -format UDZO -ov "BurnRate-$VER-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: |
            BurnRate-*-arm64.zip
            BurnRate-*-arm64.dmg
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build Linux packages
        run: scripts/make_linux_app.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          retention-days: 14

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: v
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "${{ github.ref_name }}" }
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE

      - name: Build Windows package
        shell: pwsh
        run: scripts/make_windows_app.ps1 -Version "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: dist/*.zip
          retention-days: 14

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      # gh needs a git repository for release operations.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Resolve tag
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The in-app updater refuses a release without a matching entry.
      - name: Generate combined checksums
        run: |
          ls -la assets
          ( cd assets && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS )

      - name: Attach all assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" assets/* --clobber
