name: Release

# Three entry points:
#  - push of a semver tag (manual tags)
#  - workflow_dispatch with an explicit tag (backfill an existing release)
#  - workflow_call from release-please.yml
#
# Why the explicit call: release-please creates its tag with GITHUB_TOKEN,
# and events raised with that token do NOT trigger other workflows. The tag
# push never fires this workflow, which is why v0.2.0 shipped without a
# zip/dmg. release-please.yml therefore invokes this workflow directly.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.2.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build bundle (arm64, version from tag)
        run: scripts/make_app.sh "${{ steps.v.outputs.version }}"

      - name: Verify arm64-only binary
        run: |
          BIN="dist/BurnRate.app/Contents/MacOS/BurnRate"
          file "$BIN" | grep -q "arm64" || { echo "not arm64"; exit 1; }
          file "$BIN" | grep -q "x86_64" && { echo "universal build not allowed"; exit 1; } || true

      - name: Zip app
        run: |
          ditto -c -k --keepParent dist/BurnRate.app \
            "BurnRate-${{ steps.v.outputs.version }}-arm64.zip"

      - name: Build DMG
        run: |
          VER="${{ steps.v.outputs.version }}"
          rm -rf dmg-staging && mkdir dmg-staging
          cp -R dist/BurnRate.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "BurnRate $VER" -srcfolder dmg-staging \
            -format UDZO -ov "BurnRate-$VER-arm64.dmg"

      # gh CLI rather than a release action: when release-please already
      # published the release we only add assets and leave its notes intact;
      # for a manual tag we create the release first.
      - name: Attach zip + dmg to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" BurnRate-*.zip BurnRate-*.dmg --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BurnRate-${{ steps.v.outputs.version }}-arm64
          path: |
            BurnRate-*-arm64.zip
            BurnRate-*-arm64.dmg
          retention-days: 14
