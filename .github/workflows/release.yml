name: Release

# Three entry points:
#  - push of a semver tag
#  - workflow_dispatch, for backfilling an existing release (pass its tag) or for
#    checking packaging (leave the tag blank and set `dry_run` — the dispatched
#    ref is then what gets built, so a release change can be exercised on a
#    branch without creating a release)
#  - workflow_call from release-please.yml
#
# Why the explicit call: release-please creates its tag with GITHUB_TOKEN, and
# events raised with that token do NOT trigger other workflows. The tag push never
# fires this workflow, which is why v0.2.0 shipped with no assets.
# release-please.yml therefore invokes this workflow directly.
#
# The version comes from `[workspace.package] version` in Cargo.toml — the single
# source, which release-please bumps — and never from the tag. Naming the
# artifacts after what was actually built means a dry run on a branch still
# produces sensibly named files, and the tag is then checked *against* the
# version rather than trusted. A macOS check additionally confirms the built
# bundle agrees, which is what catches `tauri.conf.json` growing a `version` field
# back and silently overriding the crate version.
#
# Builds are split per OS and a final job publishes every artifact plus one
# combined SHA256SUMS. The macOS app is **ad-hoc signed and not notarised**, so
# Gatekeeper quarantines it on first launch; README explains the two ways past
# that. Nothing here needs a signing identity, and no secrets are required.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach assets to. Blank builds the dispatched ref instead."
        required: false
        type: string
      dry_run:
        description: "Build the bundles but do not touch the release"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: write

env:
  TAURI_CLI: npx --yes "@tauri-apps/cli@^2"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - &resolve-version
        name: Resolve the version, and check the tag against it
        id: v
        shell: bash
        run: |
          set -euo pipefail
          VER=$(cargo metadata --no-deps --format-version 1 --quiet \
                 | jq -r '.packages[] | select(.name == "burnrate-desktop") | .version')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VER" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $VER"
            exit 1
          fi
          echo "building version $VER (tag '${TAG:-none}')"

      - name: Install the frontend
        working-directory: ui
        run: npm ci

      - name: Build and bundle
        run: ${{ env.TAURI_CLI }} build --bundles app,dmg

      # The bundle's version must be the crate's. It is, unless `version` has been
      # put back into tauri.conf.json, which overrides it.
      - name: Check the bundle carries that version
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          APP=$(ls -d target/release/bundle/macos/*.app)
          BUNDLE_VER=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          echo "cargo=$VER  bundle=$BUNDLE_VER"
          [ "$BUNDLE_VER" = "$VER" ] || {
            echo "::error::$APP says $BUNDLE_VER but Cargo.toml says $VER"
            exit 1
          }

      - name: Package
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          APP=$(ls -d target/release/bundle/macos/*.app)
          ditto -c -k --keepParent "$APP" "BurnRate-$VER-arm64.zip"
          cp target/release/bundle/dmg/*.dmg "BurnRate-$VER-arm64.dmg"
          ls -la BurnRate-$VER-arm64.*

      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: |
            BurnRate-*-arm64.zip
            BurnRate-*-arm64.dmg
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - *resolve-version

      # WebKitGTK for the webview; GTK3 + libayatana for the tray-icon backend.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Install the frontend
        working-directory: ui
        run: npm ci

      - name: Build and bundle
        run: ${{ env.TAURI_CLI }} build --bundles deb,appimage

      - name: Package
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          cp target/release/bundle/deb/*.deb "BurnRate-$VER-amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "BurnRate-$VER-amd64.AppImage"
          ls -la BurnRate-$VER-amd64.*

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux
          path: |
            BurnRate-*-amd64.deb
            BurnRate-*-amd64.AppImage
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - *resolve-version

      - name: Install the frontend
        working-directory: ui
        run: npm ci

      # NSIS rather than MSI: no WiX toolchain to keep working, and the installer
      # is a single file. WebView2 is bootstrapped by the installer.
      - name: Build and bundle
        run: ${{ env.TAURI_CLI }} build --bundles nsis

      - name: Package
        shell: pwsh
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe
          Copy-Item $setup "BurnRate-$env:VER-x64-setup.exe"
          Get-ChildItem "BurnRate-$env:VER-x64-setup.exe" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: BurnRate-*-x64-setup.exe
          retention-days: 14

  publish:
    needs: [macos, linux, windows]
    # `inputs.dry_run` is only ever set by workflow_dispatch, and is empty (falsy)
    # for a tag push or a workflow_call.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    steps:
      # gh needs a git repository for release operations.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Resolve tag
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate combined checksums
        run: |
          ls -la assets
          ( cd assets && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS )

      - name: Attach all assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" assets/* --clobber
