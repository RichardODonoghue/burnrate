name: Core (Linux)

# Proves BurnRateCore stays platform-independent: it must build with the Linux
# Swift toolchain and no Apple frameworks. The macOS app target is not built here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: core-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build + test platform-independent core
        run: |
          swift build --target BurnRateCore
          swift test

  linux-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build the Linux app
        run: swift build --product BurnRateLinux
