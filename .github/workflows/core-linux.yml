name: Core (Linux)

# Proves BurnRateCore stays platform-independent: it must build with the Linux
# Swift toolchain and no Apple frameworks. The macOS app target is not built here.

on:
  push:
    branches: [main]
  # Base-branch filter: these build and test the *Swift* app, which lives on
  # `main` until the Tauri rewrite is cut over. Without it they run on every PR,
  # including the rewrite's own PRs into `rewrite/tauri`, and gate them on the
  # app being replaced. The rewrite's checks are in `tauri.yml`.
  pull_request:
    branches: [main]

concurrency:
  group: core-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build + test platform-independent core
        run: |
          swift build --target BurnRateCore
          swift test

  linux-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build the Linux app
        run: swift build --product BurnRate
