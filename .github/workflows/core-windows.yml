name: Core (Windows)

# Proves BurnRateCore stays platform-independent: it must build and pass its
# tests with the Windows Swift toolchain and no Apple frameworks.

on:
  push:
    branches: [main]
  # Base-branch filter: these build and test the *Swift* app, which lives on
  # `main` until the Tauri rewrite is cut over. Without it they run on every PR,
  # including the rewrite's own PRs into `rewrite/tauri`, and gate them on the
  # app being replaced. The rewrite's checks are in `tauri.yml`.
  pull_request:
    branches: [main]

concurrency:
  group: core-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE

      - name: Build + test platform-independent core
        run: |
          swift build --target BurnRateCore
          swift test

      - name: Build the Windows app
        run: swift build --product BurnRate
