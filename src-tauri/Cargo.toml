[package]
name = "burnrate-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BurnRate — AI plan usage in the menu bar"
default-run = "burnrate-desktop"

[lib]
name = "burnrate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
burnrate-core = { path = "../crates/burnrate-core" }
tauri-plugin-notification = "2"

# macOS notifications go through UNUserNotificationCenter. The notification
# plugin cannot do this: it routes through `notify-rust` -> `mac-notification-sys`,
# which posts via `NSUserNotificationCenter` — deprecated in macOS 10.14 and inert
# on current releases, so `show()` reports success while nothing is displayed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
